    <line x1="72" y1="0" x2="-120" y2="60" stroke-opacity=".6" vector-effect="non-scaling-stroke" />
    <line x1="80" y1="0" x2="-80" y2="60" stroke-opacity=".6" vector-effect="non-scaling-stroke" />
